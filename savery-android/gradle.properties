# Gradle JVM memory settings
# Fixes: java.lang.OutOfMemoryError: Java heap space during Kotlin compilation

org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel builds — faster compilation
org.gradle.parallel=true

# Build caching — skip recompiling unchanged modules
org.gradle.caching=true

# Configuration cache — disabled temporarily to clear stale KSP state after import fixes
# Re-enable after first successful build: org.gradle.configuration-cache=true
org.gradle.configuration-cache=false

# Use AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Suppress warnings about experimental features
# Suppress unsupported compile SDK warning (studio ships SDK 36, we target 35)
android.suppressUnsupportedCompileSdk=35
